<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Error Fixer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-red-600 mb-2">Switch Error Fixer</h1>
            <p class="text-gray-600">Encuentra la solución a los errores más comunes de Atmosphère y la scene de Switch.</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="relative">
                <input type="text" id="searchInput" 
                    class="w-full text-lg p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" 
                    placeholder="Ej. 2002-4364, 010000000000000C, tema, pantalla negra..."
                    onkeyup="searchErrors()">
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>

        <div id="results" class="space-y-4">
            <!-- Los resultados aparecerán aquí -->
        </div>
        
        <div id="noResults" class="hidden text-center text-gray-500 py-8">
            No se encontraron errores con esa búsqueda. ¡Asegúrate de escribir el código o palabra clave correctamente!
        </div>
    </div>

    <script>
        // Esta es la "base de datos" simulada. ¡Aquí es donde iríamos añadiendo más errores!
        const errorDatabase = [
            {
                codigo: "2002-4364",
                programa: "010000000000000C",
                titulo: "Crash de Atmosphere durante el arranque",
                causas: ["Temas personalizados incompatibles con la nueva versión", "microSD en exFAT corrupta", "Datos de guardado corruptos"],
                solucion: "1. Si actualizaste recientemente, conecta la SD al PC, ve a 'atmosphere/contents' y borra la carpeta '0100000000001000' (Temas).\\n2. Comprueba si tu SD tiene errores (preferible usar FAT32).\\n3. Recrea la emuMMC si el fallo persiste."
            },
            {
                codigo: "2002-1002",
                programa: "Varios (al iniciar juegos)",
                titulo: "Error de Tarjeta SD / Datos Corruptos en Juegos",
                causas: ["Partición de la emuNAND corrupta", "Juego mal instalado o archivos dañados", "Tarjeta microSD genérica/falsa o formateada en exFAT"],
                solucion: "1. Ve a Configuración de la consola -> Gestión de datos -> Programas, selecciona el juego que falla y dale a 'Comprobar si hay datos dañados'.\\n2. Si el error solo ocurre al instalar juegos nuevos o actualizar, es muy probable que tu SD sea falsa o el formato exFAT se haya corrompido. Haz un backup y formatea a FAT32.\\n3. Borra el juego y vuélvelo a instalar desde cero (preferiblemente a través de cable USB/DBI)."
            },
            {
                codigo: "2168-0002",
                programa: "0100000000001000",
                titulo: "Error al abrir Homebrew (Applet Mode)",
                causas: ["Intentar abrir una app pesada desde el Álbum", "Homebrew desactualizado"],
                solucion: "Abre el Homebrew Launcher manteniendo pulsado el botón 'R' mientras abres cualquier juego que tengas instalado. Esto dará acceso a toda la RAM de la consola."
            },
            {
                codigo: "2001-0123",
                programa: "Varios",
                titulo: "Falta de sigpatches / Error de firma",
                causas: ["Los parches de firmas (sigpatches) no están instalados o están desactualizados."],
                solucion: "Descarga e instala los últimos sigpatches correspondientes a tu versión de Atmosphère y cópialos en la raíz de tu tarjeta SD."
            },
            {
                codigo: "2162-0002",
                programa: "010000000000002B",
                titulo: "Crasheo por Sysmodule incompatible",
                causas: ["Un módulo en segundo plano (ej. SysDVR, MissionControl, Tesla) no es compatible con tu versión actual de Atmosphère."],
                solucion: "Ve a la carpeta 'atmosphere/contents' en tu SD y borra la carpeta correspondiente al módulo que falla (el código de programa te lo indicará, ej. 010000000000002B). También puedes actualizar el sysmodule."
            }
        ];

        function renderResults(results) {
            const resultsContainer = document.getElementById('results');
            const noResults = document.getElementById('noResults');
            
            resultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            results.forEach(error => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow border-l-4 border-red-500 overflow-hidden';
                
                // Formatear solución con saltos de línea
                const solucionHtml = error.solucion.split('\\n').map(line => `<p class="mb-1">${line}</p>`).join('');
                
                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex flex-col sm:flex-row justify-between items-start mb-2">
                            <h2 class="text-xl font-bold text-gray-800">${error.titulo}</h2>
                            <span class="bg-red-100 text-red-800 text-sm font-bold px-2 py-1 rounded mt-2 sm:mt-0 whitespace-nowrap">${error.codigo}</span>
                        </div>
                        ${error.programa !== "Varios" ? `<p class="text-xs text-gray-500 mb-4 font-mono bg-gray-100 inline-block px-2 py-1 rounded">Program: ${error.programa}</p>` : ''}
                        
                        <div class="mb-4">
                            <h3 class="font-semibold text-gray-700 mb-1">Causas probables:</h3>
                            <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                                ${error.causas.map(c => `<li>${c}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="bg-green-50 p-4 rounded-md border border-green-200">
                            <h3 class="font-bold text-green-800 mb-2 flex items-center">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Solución
                            </h3>
                            <div class="text-sm text-green-900">
                                ${solucionHtml}
                            </div>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function searchErrors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = errorDatabase.filter(error => {
                return error.codigo.toLowerCase().includes(query) ||
                       error.programa.toLowerCase().includes(query) ||
                       error.titulo.toLowerCase().includes(query) ||
                       error.causas.some(c => c.toLowerCase().includes(query));
            });
            
            renderResults(filtered);
        }

        // Mostrar todos los resultados por defecto al cargar la página
        renderResults(errorDatabase);
    </script>
</body>
</html>
