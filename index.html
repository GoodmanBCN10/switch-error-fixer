<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Error Fixer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-red-600 mb-2">Switch Error Fixer</h1>
            <p class="text-gray-600">Base de datos de soluciones de la scene (Atmosphère, Hekate, etc.)</p>
        </header>

        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="relative">
                <input type="text" id="searchInput" 
                    class="w-full text-lg p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500" 
                    placeholder="Busca un código (ej. 2002-4364), programa (0100...bd00) o problema (pantalla negra)..."
                    onkeyup="searchErrors()">
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>

        <div id="results" class="space-y-4">
            <!-- Los resultados aparecerán aquí -->
        </div>
        
        <div id="noResults" class="hidden text-center text-gray-500 py-8">
            No se encontraron errores con esa búsqueda. ¡Asegúrate de escribir el código o palabra clave correctamente!
        </div>
    </div>

    <script src="errores.js"></script>
    <script>
        function renderResults(results) {
            const resultsContainer = document.getElementById('results');
            const noResults = document.getElementById('noResults');
            
            resultsContainer.innerHTML = '';
            
            if (results.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            results.forEach(error => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-lg shadow border-l-4 border-red-500 overflow-hidden';
                
                const solucionHtml = error.solucion.split('\\n').map(line => `<p class="mb-1">${line}</p>`).join('');
                
                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex flex-col sm:flex-row justify-between items-start mb-2">
                            <h2 class="text-xl font-bold text-gray-800">${error.titulo}</h2>
                            <span class="bg-red-100 text-red-800 text-sm font-bold px-2 py-1 rounded mt-2 sm:mt-0 whitespace-nowrap">${error.codigo}</span>
                        </div>
                        
                        <div class="flex items-center gap-2 mb-4">
                            ${error.programa !== "Varios" ? `<span class="text-xs text-gray-600 bg-gray-100 px-2 py-1 rounded font-mono border">Prog: ${error.programa}</span>` : ''}
                            <span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">📌 ${error.fuente}</span>
                        </div>
                        
                        <div class="mb-4">
                            <h3 class="font-semibold text-gray-700 mb-1">Causas probables:</h3>
                            <ul class="list-disc list-inside text-sm text-gray-600 space-y-1">
                                ${error.causas.map(c => `<li>${c}</li>`).join('')}
                            </ul>
                        </div>
                        
                        <div class="bg-green-50 p-4 rounded-md border border-green-200">
                            <h3 class="font-bold text-green-800 mb-2 flex items-center">
                                <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                Solución
                            </h3>
                            <div class="text-sm text-green-900">
                                ${solucionHtml}
                            </div>
                        </div>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        function searchErrors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = errorDatabase.filter(error => {
                const searchString = [
                    error.codigo,
                    error.programa,
                    error.titulo,
                    error.fuente,
                    ...(error.alias || []),
                    ...error.causas
                ].join(' ').toLowerCase();
                
                return searchString.includes(query);
            });
            
            renderResults(filtered);
        }

        renderResults(errorDatabase);
    </script>
</body>
</html>
